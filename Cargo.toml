[package]
name = "mfcalc"
version = "0.2.0"
edition = "2021"
description = "Molecular formula calculator from exact mass with isotope pattern prediction"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
comfy-table = "7"

[profile.release]
opt-level = 3
lto = true
